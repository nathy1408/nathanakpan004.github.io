<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Assignment Website - Register</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .navbar {
      background-color: #1a252f;
      display: flex;
      justify-content: center;
      padding: 12px 0;
      border-radius: 4px;
    }
    .navbar a {
      color: #ffffff;
      text-decoration: none;
      padding: 8px 18px;
      font-weight: bold;
      font-size: 15px;
    }
    .navbar a:hover, .navbar a.active {
      background-color: #2c3e50;
      border-radius: 4px;
    }
    .container {
      background-color: #ffffff;
      max-width: 900px;
      margin: 25px auto;
      padding: 40px;
      border-radius: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
      min-height: 250px;
    }
    h1 {
      margin-top: 0;
      font-size: 28px;
      color: #1a252f;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
    .form-group input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      background-color: #1a252f;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #2c3e50;
    }
    footer {
      text-align: center;
      margin-top: 40px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <a href="index.html">Home</a>
    <a href="about.html">About Me</a>
    <a href="services.html">Services</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="lecturer-comment.html">Lecturer's Comment</a>
    <a href="register.html" class="active">Register</a>
    <a href="store.html">Store</a>
  </div>

  <div class="container">
    <h1>Student Registration Form</h1>
    <form onsubmit="alert('Registration Successful!'); return false;">
      <div class="form-group">
        <label>Full Name:</label>
        <input type="text" required placeholder="Enter full name">
      </div>
      <div class="form-group">
        <label>Registration Number:</label>
        <input type="text" required placeholder="Enter reg number">
      </div>
      <div class="form-group">
        <label>Email Address:</label>
        <input type="email" required placeholder="Enter email address">
      </div>
      <button type="submit">Register</button>
    </form>
  </div>

  <footer>
    &copy; Akpan, Nathaniel Promise AK22/PHS/CSC/004.
  </footer>

</body>
</html>
